

services:
  db:
    image: postgres:16-alpine
    container_name: referral_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: referral_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: referral_server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/referral_db
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkey_change_in_production}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PORT: 4000
      CLIENT_URL: http://localhost:3000
    ports:
      - '4000:4000'
    # Run migrations + seed before starting the server
    command: >
      sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts && npm start"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: referral_client
    restart: unless-stopped
    depends_on:
      - server
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - '3000:3000'

volumes:
  postgres_data:

